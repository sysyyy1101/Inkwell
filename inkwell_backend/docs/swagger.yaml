basePath: /api/v1
definitions:
  controller.MyCode:
    enum:
    - 1000
    - 1001
    - 1002
    - 1003
    - 1004
    - 1005
    - 1006
    - 1007
    - 1008
    - 1009
    - 1010
    format: int64
    type: integer
    x-enum-varnames:
    - CodeSuccess
    - CodeInvalidParams
    - CodeUserExist
    - CodeUserNotExist
    - CodeInvalidPassword
    - CodeServerBusy
    - CodeInvalidToken
    - CodeInvalidAuthFormat
    - CodeNotLogin
    - CodeNotFound
    - CodeTooManyRequests
  controller.ResponseData:
    properties:
      code:
        $ref: '#/definitions/controller.MyCode'
      data: {}
      message:
        type: string
    type: object
  models.ApiComment:
    properties:
      author_id:
        example: "0"
        type: string
      author_name:
        type: string
      comment_id:
        example: "0"
        type: string
      content:
        type: string
      create_time:
        type: string
      parent_id:
        example: "0"
        type: string
      post_id:
        example: "0"
        type: string
    type: object
  models.ApiPostDetail:
    properties:
      author_id:
        example: "0"
        type: string
      author_name:
        type: string
      comment_num:
        type: integer
      community_id:
        type: integer
      community_name:
        type: string
      content:
        type: string
      create_time:
        type: string
      post_id:
        description: |-
          雪花算法生成的 ID 是 64 位整数, 超过 JS Number 的安全范围(2^53-1),
          序列化成字符串返回, 避免前端精度丢失后拿错误的 ID 去请求详情。
        example: "0"
        type: string
      status:
        type: integer
      title:
        type: string
      vote_num:
        description: VoteNum 是 Redis 中保存的净票数(赞成 - 反对, 可能为负); CommentNum 是评论数
        type: integer
    type: object
  models.CommentIDResponse:
    properties:
      comment_id:
        description: CommentID 是雪花算法生成的 64 位 ID, 用字符串返回避免前端精度丢失
        example: "3458764513820540928"
        type: string
    type: object
  models.Community:
    properties:
      community_id:
        type: integer
      community_name:
        type: string
    type: object
  models.CommunityDetail:
    properties:
      community_id:
        type: integer
      community_name:
        type: string
      create_time:
        type: string
      introduction:
        type: string
    type: object
  models.CreateCommentForm:
    properties:
      content:
        example: 写得很清楚, 学到了
        type: string
      parent_id:
        description: ParentID 回复的父评论 ID, 不回复时传 0
        example: "0"
        type: string
      post_id:
        description: PostID 是雪花算法生成的 64 位 ID, 需要用字符串传递, 否则会丢精度
        example: "3458764513820540928"
        type: string
    required:
    - content
    - post_id
    type: object
  models.CreatePostForm:
    properties:
      community_id:
        description: CommunityID 版块 ID, 数字和字符串都接受
        example: 1
        type: integer
      content:
        example: gin 是一个用 Go 编写的 HTTP web 框架
        type: string
      title:
        example: gin 框架入门
        type: string
    required:
    - community_id
    - content
    - title
    type: object
  models.LoginForm:
    properties:
      password:
        example: "123456"
        type: string
      username:
        example: zhangsan
        type: string
    required:
    - password
    - username
    type: object
  models.LoginResponse:
    properties:
      accessToken:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      refreshToken:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      userID:
        description: UserID 是雪花算法生成的 64 位 ID, 用字符串返回避免前端精度丢失
        example: "3458764513820540928"
        type: string
      username:
        example: zhangsan
        type: string
    type: object
  models.PostIDResponse:
    properties:
      post_id:
        description: PostID 是雪花算法生成的 64 位 ID, 用字符串返回避免前端精度丢失
        example: "3458764513820540928"
        type: string
    type: object
  models.PostListItem:
    properties:
      author_id:
        example: "0"
        type: string
      author_name:
        type: string
      comment_num:
        type: integer
      community_id:
        type: integer
      community_name:
        type: string
      create_time:
        description: 发帖时间(unix 秒)
        type: integer
      post_id:
        example: "0"
        type: string
      score:
        description: 榜单排序分, 只有榜单接口会返回
        type: number
      summary:
        type: string
      title:
        type: string
      vote_num:
        description: VoteNum 净票数(赞成 - 反对), 可能为负
        type: integer
    type: object
  models.RefreshTokenResponse:
    properties:
      accessToken:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      refreshToken:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  models.RegisterForm:
    properties:
      confirm_password:
        type: string
      password:
        type: string
      re_password:
        description: RePassword 兼容旧版前端使用的 re_password 字段
        type: string
      username:
        type: string
    type: object
  models.UserProfile:
    properties:
      create_time:
        type: string
      user_id:
        example: "0"
        type: string
      username:
        type: string
    type: object
  models.VoteForm:
    properties:
      direction:
        description: Direction 1 赞成 / 0 取消 / -1 反对
        enum:
        - -1
        - 0
        - 1
        example: 1
        type: integer
      post_id:
        description: PostID 是雪花算法生成的 64 位 ID, 需要用字符串传递, 否则会丢精度
        example: "3458764513820540928"
        type: string
    required:
    - direction
    - post_id
    type: object
  models.VoteResponse:
    properties:
      post_id:
        description: PostID 是雪花算法生成的 64 位 ID, 用字符串返回避免前端精度丢失
        example: "3458764513820540928"
        type: string
      vote_num:
        description: VoteNum 投票之后的净票数(赞成票 - 反对票), 可能为负; 客户端直接用它刷新展示, 不要按本地记录推算
        example: 12
        type: integer
    type: object
info:
  contact: {}
  description: |-
    基于 gin + MySQL + Redis + JWT 的社区后端接口文档。
    所有接口返回统一结构: {"code":1000,"message":"success","data":{}}。业务失败时 HTTP 状态码仍然是 200(只有访问不存在的路由才返回 404), 需要根据 code 判断结果, code 取值见 controller/code.go。
    需要登录的接口要在请求头带上 Authorization: Bearer <accessToken>; access token 失效(1006)时可以调用 /api/v1/refresh_token 刷新后重放请求。
    所有 64 位 ID(用户/帖子/评论)在 JSON 中都使用字符串传输, 用数字传会丢精度。
  title: Inkwell 社区 API
  version: 0.1.1
paths:
  /comment:
    get:
      description: |-
        按 post_id 查询某个帖子的全部评论(按时间正序), 或者按 ids 批量查询评论, 游客可访问。
        两个参数都没传或者 ID 非法时返回 code 1001。
      parameters:
      - description: 帖子ID, 和 ids 二选一
        in: query
        name: post_id
        type: string
      - collectionFormat: multi
        description: 评论ID列表, 可以重复传多个, 例如 ?ids=1&ids=2
        in: query
        items:
          type: string
        name: ids
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: 评论列表
          schema:
            allOf:
            - $ref: '#/definitions/controller.ResponseData'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.ApiComment'
                  type: array
              type: object
      summary: 评论列表
      tags:
      - 评论
    post:
      consumes:
      - application/json
      description: |-
        给帖子发表评论, 需要登录。内容最长 2000 字。
        失败时 HTTP 状态码仍是 200, 通过响应体里的 code 判断: 参数错误 1001, 未登录或 token 失效 1006/1008, 服务繁忙 1005。
      parameters:
      - description: 评论参数, parent_id 是要回复的评论ID, 不回复传 0
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CreateCommentForm'
      produces:
      - application/json
      responses:
        "200":
          description: 评论成功, 返回新评论ID
          schema:
            allOf:
            - $ref: '#/definitions/controller.ResponseData'
            - properties:
                data:
                  $ref: '#/definitions/models.CommentIDResponse'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 发表评论
      tags:
      - 评论
  /community:
    get:
      description: 查询全部版块, 游客可访问
      produces:
      - application/json
      responses:
        "200":
          description: 版块列表, 没有数据时返回空数组
          schema:
            allOf:
            - $ref: '#/definitions/controller.ResponseData'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Community'
                  type: array
              type: object
      summary: 版块列表
      tags:
      - 版块
  /community/{id}:
    get:
      description: 按版块 ID 查询版块详情, 游客可访问。版块 ID 非法或不存在时返回 code 1009。
      parameters:
      - description: 版块ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 版块详情
          schema:
            allOf:
            - $ref: '#/definitions/controller.ResponseData'
            - properties:
                data:
                  $ref: '#/definitions/models.CommunityDetail'
              type: object
      summary: 版块详情
      tags:
      - 版块
  /community/{id}/post:
    get:
      description: |-
        分页读取某个版块下的帖子榜单, 游客可访问。内部用 ZInterStore 求"版块帖子集合"与榜单的交集, 结果缓存 60 秒。
        版块 ID 不存在时返回 code 1009, ID 非法或 order 取值不合法时返回 code 1001。
      parameters:
      - description: 版块ID
        in: path
        name: id
        required: true
        type: integer
      - default: score
        description: 排序方式
        enum:
        - score
        - time
        in: query
        name: order
        type: string
      - default: 1
        description: 页码, 从1开始
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 帖子列表, 每页20条
          schema:
            allOf:
            - $ref: '#/definitions/controller.ResponseData'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.PostListItem'
                  type: array
              type: object
      summary: 版块帖子榜单
      tags:
      - 版块
  /login:
    post:
      consumes:
      - application/json
      description: |-
        登录成功后返回 accessToken(2 小时有效)与 refreshToken(7 天有效)。
        用户名不存在和密码错误都返回 code 1004, 避免被用来枚举用户名。
      parameters:
      - description: 登录参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.LoginForm'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            allOf:
            - $ref: '#/definitions/controller.ResponseData'
            - properties:
                data:
                  $ref: '#/definitions/models.LoginResponse'
              type: object
      summary: 用户登录
      tags:
      - 用户
  /ping:
    get:
      description: 探活接口, 游客可访问
      produces:
      - application/json
      responses:
        "200":
          description: 服务正常, data 固定为 pong
          schema:
            allOf:
            - $ref: '#/definitions/controller.ResponseData'
            - properties:
                data:
                  type: string
              type: object
      summary: 健康检查
      tags:
      - 系统
  /post:
    get:
      description: |-
        从 Redis 榜单分页读取帖子, order=score 按热度排序, order=time 按发帖时间排序, 游客可访问。
        order 取值不合法时返回 code 1001。
      parameters:
      - default: score
        description: 排序方式
        enum:
        - score
        - time
        in: query
        name: order
        type: string
      - default: 1
        description: 页码, 从1开始
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 帖子列表, 每页20条
          schema:
            allOf:
            - $ref: '#/definitions/controller.ResponseData'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.PostListItem'
                  type: array
              type: object
      summary: 帖子榜单
      tags:
      - 帖子
    post:
      consumes:
      - application/json
      description: |-
        创建帖子, 需要登录。标题最长 128 字, 内容最长 8192 字。
        失败时 HTTP 状态码仍是 200, 通过响应体里的 code 判断: 参数错误 1001, 未登录或 token 失效 1006/1008, 服务繁忙 1005。
      parameters:
      - description: 发帖参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CreatePostForm'
      produces:
      - application/json
      responses:
        "200":
          description: 发帖成功, 返回新帖子ID
          schema:
            allOf:
            - $ref: '#/definitions/controller.ResponseData'
            - properties:
                data:
                  $ref: '#/definitions/models.PostIDResponse'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 发帖
      tags:
      - 帖子
  /post/{id}:
    get:
      description: 查询帖子详情, 并带上 Redis 里的实时票数与评论数, 游客可访问。帖子不存在时返回 code 1009。
      parameters:
      - description: 帖子ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 帖子详情
          schema:
            allOf:
            - $ref: '#/definitions/controller.ResponseData'
            - properties:
                data:
                  $ref: '#/definitions/models.ApiPostDetail'
              type: object
      summary: 帖子详情
      tags:
      - 帖子
  /post2:
    get:
      description: 直接查询 MySQL 的帖子列表, 按发帖时间倒序, 游客可访问
      parameters:
      - default: 1
        description: 页码, 从1开始
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页条数, 最大50
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 帖子列表
          schema:
            allOf:
            - $ref: '#/definitions/controller.ResponseData'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.PostListItem'
                  type: array
              type: object
      summary: 帖子列表(MySQL)
      tags:
      - 帖子
  /refresh_token:
    get:
      description: |-
        access token 放在 Authorization 请求头(已过期也要带), refresh token 放在 query 参数里。
        token 无效或已过期时返回 code 1006。
      parameters:
      - description: Bearer <accessToken>
        in: header
        name: Authorization
        required: true
        type: string
      - description: refresh token
        in: query
        name: refresh_token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功
          schema:
            allOf:
            - $ref: '#/definitions/controller.ResponseData'
            - properties:
                data:
                  $ref: '#/definitions/models.RefreshTokenResponse'
              type: object
      summary: 刷新 access token
      tags:
      - 用户
  /signup:
    post:
      consumes:
      - application/json
      description: |-
        注册新用户。用户名长度 2-64, 密码长度 6-64, 两次密码必须一致。
        失败时 HTTP 状态码仍是 200, 通过响应体里的 code 判断: 参数错误 1001, 用户名重复 1002。
      parameters:
      - description: 注册参数, confirm_password 和 re_password 传一个即可
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.RegisterForm'
      produces:
      - application/json
      responses:
        "200":
          description: 注册成功, data 为 null
          schema:
            $ref: '#/definitions/controller.ResponseData'
      summary: 用户注册
      tags:
      - 用户
  /user/{id}:
    get:
      description: 查询用户的公开信息(用户名、注册时间), 游客可访问。用户不存在或 ID 非法时返回 code 1009。
      parameters:
      - description: 用户ID(雪花 ID, 用字符串传)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 用户信息
          schema:
            allOf:
            - $ref: '#/definitions/controller.ResponseData'
            - properties:
                data:
                  $ref: '#/definitions/models.UserProfile'
              type: object
      summary: 用户主页
      tags:
      - 用户
  /user/{id}/post:
    get:
      description: |-
        分页查询某个用户发布的帖子(按发帖时间倒序), 游客可访问, 票数与评论数来自 Redis。
        用户不存在时返回 code 1009, ID 非法时返回 code 1001。
      parameters:
      - description: 用户ID(雪花 ID, 用字符串传)
        in: path
        name: id
        required: true
        type: string
      - default: 1
        description: 页码, 从1开始
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页条数, 最大50
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 帖子列表
          schema:
            allOf:
            - $ref: '#/definitions/controller.ResponseData'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.PostListItem'
                  type: array
              type: object
      summary: 用户发布的帖子
      tags:
      - 用户
  /vote:
    post:
      consumes:
      - application/json
      description: |-
        点赞/点踩/取消投票, 需要登录。发帖超过一周的帖子不能再投票。direction: 1 赞成 / 0 取消 / -1 反对。
        失败时 HTTP 状态码仍是 200, 通过响应体里的 code 判断: 参数错误/重复投票/已过投票时间 1001, 未登录或 token 失效 1006/1008。
      parameters:
      - description: 投票参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.VoteForm'
      produces:
      - application/json
      responses:
        "200":
          description: 投票成功, 返回投票后的净票数(赞成 - 反对)
          schema:
            allOf:
            - $ref: '#/definitions/controller.ResponseData'
            - properties:
                data:
                  $ref: '#/definitions/models.VoteResponse'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 给帖子投票
      tags:
      - 投票
securityDefinitions:
  ApiKeyAuth:
    description: 取值格式 "Bearer <accessToken>"
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
