mode: "dev"
port: 8081
# 雪花算法机器 ID: 多实例部署时每个实例必须不同(1-65535), 也可以用环境变量 INKWELL_MACHINE_ID 覆盖
machine_id: 1
# JWT 签名密钥: dev 模式留空会使用内置的开发密钥, 非 dev 模式必须显式配置
# 也可以用环境变量 INKWELL_JWT_SECRET 覆盖(优先级更高)
jwt_secret: ""

# 登录接口的令牌桶限流(整个进程只有一个桶, 不是按 IP 分桶)
# rate: 每秒补充的令牌数; burst: 桶容量(允许的突发次数)
login_rate_limit:
  rate: 2
  burst: 10

log:
  level: "debug"
  filename: "./log/inkwell.log"
  max_size: 1000
  max_age: 3600
  max_backups: 5

mysql:
  host: 127.0.0.1
  port: 3306
  user: root
  password: aa123456
  db: inkwell_pre
  max_open_conns: 100
  max_idle_conns: 20

redis:
  host: 127.0.0.1
  port: 6379
  db: 0
