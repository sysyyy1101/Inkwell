mode: "release"
port: 8081
# 雪花算法机器 ID: 多实例部署时每个实例必须不同(1-65535), 也可以用环境变量 INKWELL_MACHINE_ID 覆盖
machine_id: 1
# JWT 签名密钥: release 模式不允许留空, 也不允许使用代码里的内置开发密钥。
# 正式部署请改成自己的随机密钥, 或者用环境变量 INKWELL_JWT_SECRET 覆盖。
jwt_secret: "inkwell-docker-secret-change-me"

# 登录接口的令牌桶限流(整个进程只有一个桶, 不是按 IP 分桶)
login_rate_limit:
  rate: 2
  burst: 10

log:
  level: "info"
  filename: "./log/inkwell.log"
  max_size: 1000
  max_age: 3600
  max_backups: 5

# docker-compose 里用服务名互相访问, 不能用 127.0.0.1
mysql:
  host: mysql8019
  port: 3306
  user: root
  password: root1234
  db: inkwell_pre
  max_open_conns: 100
  max_idle_conns: 20

redis:
  host: redis507
  port: 6379
  db: 0
  pool_size: 100
  min_idle_conns: 10
