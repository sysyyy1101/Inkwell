# 前端容器的 nginx 配置(挂到容器里的 /etc/nginx/conf.d/default.conf)
#
# 只干两件事:
#   1. 把 dist/ 里的静态文件发出去, 并支持 vue-router 的 history 模式(刷新 /post/123 不 404);
#   2. 把 /api/v1 和 /swagger 反代到后端容器, 让浏览器只访问一个端口, 也就没有跨域问题。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 后端地址用 compose 里的服务名。这里刻意用"变量 + Docker 内置 DNS"而不是写死
    # proxy_pass http://inkwell_app:8081; —— 写死的话 nginx 只在启动时解析一次域名,
    # 后端还没起来就会直接启动失败; 用变量则每次请求才解析, 后端重启换 IP 也能跟上。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "http://inkwell_app:8081";

    # 压缩: js/css 体积能小一大截
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # 打包出来的静态资源文件名里带 hash, 内容变了文件名才会变, 所以可以放心长缓存
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # index.html 不能缓存: 它是静态资源的入口, 缓存住之后发新版本用户看不到
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 接口: /api/v1/... 原样转发给后端。
    # proxy_pass 里只写域名端口、不带路径, 所以原始 URI 会被完整保留;
    # 前缀故意不带结尾斜杠, 这样 /api/v1 和 /api/v1/post 都能匹配上。
    location /api/v1 {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 接口文档(swaggo 生成的页面)一起转发, 页脚里的"接口文档"链接就是相对路径 /swagger/index.html
    location /swagger {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # SPA 兜底必须放在最后: /post/123 这种路由在磁盘上没有对应文件,
    # 交回 index.html 由前端路由自己接管
    location / {
        try_files $uri $uri/ /index.html;
    }
}
